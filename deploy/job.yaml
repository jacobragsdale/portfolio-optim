# One run of the CLI. Airflow creates a Job from this spec per run and sets `args`, e.g.
#   [warm]                                                           each business morning, before the first run
#   [optimize, --strategy, /strategies/core.json, --portfolios, A1, A2]
apiVersion: batch/v1
kind: Job
metadata:
  generateName: optim-
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 86400  # keep a day for `kubectl logs`, then clean up
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: optim
          image: IMAGE  # e.g. <registry>.azurecr.io/portfolio-optim:<git sha>
          args: [--help]
          envFrom:
            - secretRef: {name: optim}  # every OPTIM_* variable in .env.example except those below
          env:
            - {name: OPTIM_ORACLE__MAX_CONCURRENT, value: "4"}  # per Job: two Jobs at once send twice as many
            - {name: OPTIM_ORACLE__TIMEOUT_S, value: "240"}
            - {name: OPTIM_MSSQL__MAX_CONCURRENT, value: "4"}
            - {name: OPTIM_MSSQL__TIMEOUT_S, value: "240"}
            - {name: OPTIM_SIGNALS__MAX_CONCURRENT, value: "2"}
            - {name: OPTIM_SIGNALS__TIMEOUT_S, value: "240"}
            - {name: OPTIM_WORKERS, value: "4"}  # match the CPU request
            - {name: OPTIM_SNAPSHOT_DIR, value: /snapshots}
            - {name: OPTIM_IMAGE, value: IMAGE}  # the image above, which each run's snapshot records
          resources:
            requests: {cpu: "4", memory: 6Gi}
            limits: {memory: 6Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
          volumeMounts:
            - {name: snapshots, mountPath: /snapshots}
            - {name: tmp, mountPath: /tmp}  # the multiprocessing forkserver's socket
      volumes:
        - name: snapshots
          persistentVolumeClaim: {claimName: optim-snapshots}
        - name: tmp
          emptyDir: {}
