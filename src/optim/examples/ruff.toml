# The examples sort their imports as the model repos they are copied into do: optim is a dependency there, and the
# example's own modules are the repo's.
extend = "../../../pyproject.toml"
cache-dir = "../../../.ruff_cache"

[lint.isort]
detect-same-package = false
known-third-party = ["optim", "cvxpy"]  # cvxpy: the library, though an example is named so
known-first-party = ["optim.examples"]
