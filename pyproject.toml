[project]
name = "optim"
version = "0.1.0"
description = "The run loop that quants' portfolio models share: loading, parallelism, rounding, acceptance, snapshots and replay"
readme = "README.md"
authors = [{ name = "Jacob Ragsdale", email = "jacobragsdale@protonmail.com" }]
requires-python = ">=3.14"
dependencies = [
    "cvxpy>=1.9.3",
    "grimp>=3.17",
    "highspy>=1.15.1",
    "httpx>=0.28.1",
    "mssql-python>=1.16.0",
    "numpy>=2.5.4",
    "oracledb>=26.0.1",
    "pandas>=3.0.6",
    "pyarrow>=26.0.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.0",
    "scipy>=1.18.1",
]

[project.scripts]
optim = "optim.cli:main"

[project.entry-points.pytest11]
optim = "optim.pytest_plugin"

[project.optional-dependencies]
copt = ["coptpy>=8.0.7"]  # the licensed COPT solver; tests run it size-limited, without a license

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "optim"

[dependency-groups]
dev = [
    "coptpy>=8.0.7",
    "import-linter>=2.15",
    "pandas-stubs>=3.0.5.260914",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "pytest-randomly>=5.0.0",
    "ruff>=0.17.1",
    "scipy-stubs>=1.18.1.1",
    "ty>=0.0.89",
]

[tool.ruff]
line-length = 200
required-version = ">=0.17.1"
force-exclude = true  # pre-commit passes file names; still honour excludes
show-fixes = true

[tool.ruff.lint]
select = ["ALL"]  # every rule; opt out below, with a reason
ignore = [
    "D",  # module docstrings are prose, not pydocstyle sections
    "CPY",  # no copyright headers
    "COM812",  # conflicts with the formatter
    "TC",  # annotations are lazy on 3.14, and pydantic needs its types at runtime
    "PLR2004",  # 0.5, 1e-6 and friends read better inline than as constants
    "PLR0913",  # keyword-only arguments are clearer than a parameter object
    "FBT003",  # stdlib calls such as `captureWarnings(True)` take positional booleans
    "TD003", "FIX002",  # `TODO(port)` marks where a port writes code; there is no issue to link
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "INP001"]  # pytest asserts; tests/ is not a package
"src/optim/examples/*/tests/**" = ["S101", "INP001"]  # an example's tests, which a model repo's tests/ gets

[tool.ruff.lint.isort]
split-on-trailing-comma = false

[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.format]
docstring-code-format = true
skip-magic-trailing-comma = true

[tool.ty.rules]
blanket-ignore-comment = "error"
missing-override-decorator = "error"
missing-type-argument = "error"
possibly-unresolved-reference = "warn"
unsound-return-statement = "error"
unsound-yield = "error"
unsupported-dynamic-base = "warn"

[tool.ty.environment]
extra-paths = ["tests"]  # as pytest's `pythonpath`, so test modules can import `builders`

[tool.ty.analysis]
respect-type-ignore-comments = false  # Require a specific `# ty: ignore[rule]` suppression.
strict-generic-narrowing = true

[tool.ty.terminal]
error-on-warning = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config --import-mode=importlib -m 'not integration'"
testpaths = ["tests", "src/optim/examples"]
pythonpath = ["tests"]  # test modules share `builders`
xfail_strict = true  # An xfail that starts passing is a failure, not a silent pass.
filterwarnings = [
    "error",  # pandas 3 chained assignment only warns; the lost write is otherwise invisible.
    # Add narrow, dated `ignore::` entries with a reason for third-party
    # deprecations you do not control. Never widen this back to "default".
]
markers = [
    "integration: needs a real database, container, or network; excluded from the default run",
]

[tool.coverage.run]
branch = true  # Statement coverage hides the untaken half of every condition.
source = ["src/optim"]  # coverage of tests/ is noise

[tool.coverage.report]
show_missing = true
skip_covered = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "@overload",
]
# Deliberately no fail_under: coverage is a diagnostic here, not a CI gate.

[tool.importlinter]
root_package = "optim"
include_external_packages = true  # so a contract can forbid a database driver or an HTTP client
exclude_type_checking_imports = true  # a hook's type annotation imports nothing at runtime

[[tool.importlinter.contracts]]
name = "Model code and what workers run do no I/O: the parent loads and saves"
type = "forbidden"
source_modules = [
    "optim.contract", "optim.cvxpy", "optim.models", "optim.decide", "optim.engine", "optim.acceptance", "optim.datasets",
    "optim.testing", "optim.examples",
    "optim.data.dataset", "optim.data.frames", "optim.schema",
]
forbidden_modules = [
    "optim.data.loader", "optim.data.cache", "optim.sources.sql", "optim.sources.oracle", "optim.sources.mssql",
    "optim.sources.rest", "optim.sources.file", "optim.storage", "optim.context", "optim.settings", "optim.snapshots",
    "optim.run", "optim.orders", "optim.cli", "httpx", "oracledb", "mssql_python",
]
